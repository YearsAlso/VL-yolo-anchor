[package]
name = "vl-yolo-anchor"
version = "0.1.0"
description = "VL-YOLO-Anchor desktop shell (Tauri v1)"
edition = "2021"
rust-version = "1.70"

[build-dependencies]
tauri-build = { version = "1", features = [] }

[dependencies]
tauri = { version = "1", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
custom-protocol = ["tauri/custom-protocol"]
