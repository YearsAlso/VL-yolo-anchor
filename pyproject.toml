[project]
name = "vl-yolo-anchor"
version = "0.1.0"
description = "Multi-modal YOLO-OBB training plan generation and intelligent annotation platform"
authors = [{ name = "CV Engineering", email = "dev@example.com" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "opencv-python>=4.10.0",
    "pyyaml>=6.0.2",
    "numpy>=1.26.4",
    "pillow>=10.4.0",
    "matplotlib>=3.9.2",
    "fastapi>=0.112.0",
    "uvicorn>=0.30.6",
    "pydantic>=2.9.0",
    "jinja2>=3.1.4",
]

[project.optional-dependencies]
gpu = [
    "torch>=2.4.0",
    "torchvision>=0.19.0",
    "transformers>=4.44.0",
    "accelerate>=0.33.0",
    "bitsandbytes>=0.43.3",
]
dev = [
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "pytest>=8.3.0",
]

[build-system]
requires = ["setuptools>=70.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src"]
extend-exclude = ["gui", "tasks", "prompts"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["src"]
disallow_untyped_defs = true
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
exclude = ["gui/", "tasks/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]