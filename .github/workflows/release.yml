name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Derive version from tag
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >>"$GITHUB_OUTPUT"

      - name: Package deployment assets
        run: |
          mkdir -p dist-assets
          cp docker-compose.yml dist-assets/docker-compose.yml
          cp .env.example dist-assets/.env.example
          # Sanity check the compose file references the released version.
          grep -q "${{ steps.ver.outputs.version }}" pyproject.toml \
            && echo "pyproject version matches tag" \
            || echo "::warning::pyproject.toml version differs from tag ${{ github.ref_name }}"

      - name: Create / update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: VL-YOLO-Anchor ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist-assets/docker-compose.yml
            dist-assets/.env.example
          body: |
            ## Docker images

            - `ghcr.io/${{ github.repository }}-backend:${{ steps.ver.outputs.version }}`
            - `ghcr.io/${{ github.repository }}-gui:${{ steps.ver.outputs.version }}`

            ## Quick start

            ```bash
            curl -LO https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/docker-compose.yml
            curl -LO https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/.env.example
            cp .env.example .env   # edit VL_MODEL_* / VL_ANCHOR_* as needed
            VERSION=${{ steps.ver.outputs.version }} docker compose up -d
            # open http://localhost:8080
            ```
